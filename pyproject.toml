[project]
name = "priorizacaobacklog"
version = "0.1.0"
description = "Serviço FastAPI para priorização de backlog usando LangChain + AWS Bedrock."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-aws>=0.1.0",
    "boto3>=1.34.0",
    "structlog>=24.1.0",
    "fastapi-limiter>=0.1.6",
    "redis>=5.0.0",
    "mangum>=0.17.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"


