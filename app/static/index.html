<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/prod/">
    <title>Gênio Priorizador de Backlog</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        /* Utility for truncating text */
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-clamp: 1;
        }
    </style>
</head>

<body class="bg-slate-50 h-screen flex flex-col">
    <div id="root" class="h-full flex flex-col"></div>

    <!-- Load components in order -->
    <script type="text/babel" src="static/components/EditItemModal.jsx"></script>
    <script type="text/babel" src="static/components/ChatInterface.jsx"></script>
    <script type="text/babel" src="static/components/SetupPanel.jsx"></script>
    <script type="text/babel" src="static/components/BacklogBoard.jsx"></script>
    <script type="text/babel" src="static/components/App.jsx"></script>

    <!-- Initialize app -->
    <script type="text/babel">
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
